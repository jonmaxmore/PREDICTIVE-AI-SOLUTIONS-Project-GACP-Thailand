# Isolated TEST stack — separate from the 13 production containers.
# Distinct project name, container names, network, volumes, and host ports
# (backend on 127.0.0.1:18000). Resource-capped to protect the 2-core prod host.
name: gacp-test

services:
  test-postgres:
    image: postgres:15-alpine
    container_name: gacp-test-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - test_pg:/var/lib/postgresql/data
    networks: [test-net]
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 15

  test-redis:
    image: redis:7-alpine
    container_name: gacp-test-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks: [test-net]
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 96M

  test-minio:
    image: minio/minio:latest
    container_name: gacp-test-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [test-net]
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  test-backend:
    image: ghcr.io/jonmaxmore/gacp-backend:deploy-production-latest
    container_name: gacp-test-backend
    env_file: .env.test.local
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      test-postgres: { condition: service_healthy }
      test-redis: { condition: service_started }
      test-minio: { condition: service_healthy }
    networks: [test-net]
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 768M

networks:
  test-net:
    name: gacp-test-net

volumes:
  test_pg:
    name: gacp-test-pg
