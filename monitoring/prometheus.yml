global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # GACP Backend API — Prometheus exposition at /metrics (prom-client).
  # NOTE: /api/metrics still returns JSON for the admin dashboard; the scrape
  # target is the root /metrics endpoint (text/plain; version=0.0.4).
  - job_name: "gacp-backend"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["backend:8000"]
    scrape_interval: 30s

  # NOTE: no gacp-nginx job — nginx has no Prometheus metrics endpoint
  # (nginx:80/health returns octet-stream). Add nginx-exporter to scrape it.

  # Node Exporter (system metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # cAdvisor (container metrics)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 30s

  # NOTE: postgres-exporter, redis-exporter, nginx-exporter are NOT deployed
  # in docker-compose.production.yml. Uncomment when these containers are added.
  #
  # - job_name: "postgres-exporter"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
  #   scrape_interval: 30s
  #
  # - job_name: "redis-exporter"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
  #   scrape_interval: 30s
  #
  # - job_name: "nginx-exporter"
  #   static_configs:
  #     - targets: ["nginx-exporter:9113"]
  #   scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
