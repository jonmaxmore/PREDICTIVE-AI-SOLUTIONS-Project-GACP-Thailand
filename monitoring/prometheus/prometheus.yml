global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: gacp-production

# NOTE: alertmanager and rule_files are disabled until
# alertmanager container is added to docker-compose.production.yml
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093
# rule_files:
#   - /etc/prometheus/alerts.yml

scrape_configs:
  # ==========================================
  # Prometheus Self-Monitoring
  # ==========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ==========================================
  # GACP Backend API
  # ==========================================
  - job_name: 'gacp-backend'
    static_configs:
      - targets: ['backend:8000']
    # Root /metrics, not /api/metrics. The backend exposes the Prometheus text
    # format (text/plain; version=0.0.4) at server.js:380; /api/metrics returns
    # JSON for the admin dashboard, which Prometheus cannot parse — so this
    # scrape produced nothing usable even before /api/metrics required auth.
    # Matches monitoring/prometheus.yml, which had it right.
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # ==========================================
  # Node Exporter (Host Metrics)
  # ==========================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ==========================================
  # cAdvisor (Container Metrics)
  # ==========================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # ==========================================
  # DISABLED — These exporters are not in docker-compose.production.yml
  # Uncomment when the corresponding containers are added.
