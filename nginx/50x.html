<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GACP Thailand — ระบบกำลังปรับปรุง</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
            color: #1a1a2e;
        }

        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 520px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #166534, #15803d);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(22, 101, 52, 0.25);
        }

        .logo svg {
            width: 40px;
            height: 40px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #166534;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #4b5563;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .status-card {
            background: white;
            border: 1px solid #d1fae5;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
        }

        .status-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .status-text {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .status-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .retry-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #166534, #15803d);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(22, 101, 52, 0.3);
        }

        .retry-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(22, 101, 52, 0.4);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
        </div>
        <h1>GACP Thailand</h1>
        <p class="subtitle">ระบบออกใบรับรองมาตรฐาน GACP</p>

        <div class="status-card">
            <div class="status-icon">🔧</div>
            <h2 class="status-title">ระบบกำลังปรับปรุงชั่วคราว</h2>
            <p class="status-text">
                ขณะนี้ระบบกำลังดำเนินการบำรุงรักษา<br>
                กรุณาลองใหม่อีกครั้งในอีกไม่กี่นาที
            </p>
        </div>

        <a href="/" class="retry-btn" onclick="location.reload(); return false;">
            🔄 ลองใหม่
        </a>

        <div class="footer">
            <p>GACP Certification Platform v3.0</p>
            <p>กรมการแพทย์แผนไทยและการแพทย์ทางเลือก</p>
        </div>
    </div>
</body>

</html>
