# ============================================================
# GACP Platform — Docker Internal Nginx (Production + Staging)
# ============================================================
# This runs INSIDE Docker.  It is a pure internal router.
# Host Nginx handles SSL and HTTP→HTTPS redirect at the edge.
# Docker Nginx only listens on :80 — NO SSL, NO redirects.
#
# Flow:
#   gacpth.com          → Host Nginx :443 → Docker Nginx :80 → backend/frontend
#   staging.gacpth.com  → Host Nginx :443 → Docker Nginx :80 → backend-staging/frontend-staging
#
# staging.gacpth.com shares this exact file and this exact server block — see
# the $host maps below. There is deliberately only ONE server block here: a
# second copy for staging drifts from this one the moment either file changes
# and nobody remembers to touch both. That drift is exactly how staging ended
# up skipping rate limiting, security headers, gzip, and the /api/session/ →
# frontend split this file already has — it bypassed this container entirely
# (deploy/nginx/staging.gacpth.com.conf used to proxy straight to
# 127.0.0.1:8001/3001). See docs/operations/runbooks/staging-through-docker-nginx.md.
# ============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream selection by Host header. staging.gacpth.com is the ONLY Host value
# that routes to the *-staging containers; every other Host (gacpth.com, a
# missing/spoofed Host, a direct IP hit) falls through to `default`, i.e.
# production. deploy/nginx/staging.gacpth.com.conf MUST forward the original
# Host header unchanged (`proxy_set_header Host $host;`) for this to route
# correctly — if that header is ever dropped or hardcoded there, staging
# traffic silently lands on the PRODUCTION containers below instead of
# erroring, which is the worst failure mode this file can produce.
map $host $backend_up {
    default              backend:8000;
    staging.gacpth.com   backend-staging:8000;
    demo.gacpth.com      backend-demo:8000;
}

map $host $frontend_up {
    default              frontend:3000;
    staging.gacpth.com   frontend-staging:3000;
    demo.gacpth.com      frontend-demo:3000;
}

server {
    listen 80;
    server_name _;

    # Re-resolve Docker service names at runtime. Without this, a static
    # `proxy_pass http://backend:8000` resolves ONCE at startup, so recreating
    # the backend/frontend container (new IP) strands nginx on the dead IP → 502
    # until nginx is restarted. 127.0.0.11 is Docker's embedded DNS on the
    # user-defined network; $backend_up / $frontend_up (assigned above by the
    # $host maps, not by `set` any more) force per-request re-resolution
    # instead of a resolve-once static host.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Real client IP restoration — CONFIRMED BUG, not a theoretical risk.
    #
    # /opt/gacp-platform/logs/nginx/access.log on the real host, 2026-08-05:
    #   172.18.0.1 - - [...] "GET /robots.txt HTTP/1.1" 200 483 "-" "facebookexternalhit/1.1" "2a03:2880:16ff:50::, 2a03:2880:16ff:50::"
    # Every line's $remote_addr (first field) is 172.18.0.1 — the ONE address
    # host nginx's connection to this container is ever seen from — while the
    # real visitor address sits unused in the trailing $http_x_forwarded_for
    # field (nginx:alpine's default log format, "main", logs both). Before
    # this change, $binary_remote_addr was therefore the same key for every
    # visitor on earth, so `limit_req zone=api_upload rate=5r/m` on
    # /api/applications/ was 5 requests per MINUTE for the whole internet
    # combined, not per visitor.
    #
    # Confirmed on the real host (`docker network inspect gacp-network`):
    # gacp-network is 172.18.0.0/16, gateway 172.18.0.1 — the address above.
    # That gateway is the ONLY thing this container's :80 is ever reached
    # from: the container is published solely as 127.0.0.1:8080
    # (docker-compose.production.yml), and host nginx is the only client of
    # that port. So the trust boundary is the single gateway address, not the
    # /16 it sits in — trusting the whole /16 would trust every OTHER
    # container on gacp-network too (backend, frontend, postgres, redis,
    # pgadmin, backend-staging, frontend-staging), any one of which, if
    # compromised, could reach this container directly, send a forged
    # X-Forwarded-For claiming to be any address on earth, and walk straight
    # through every limit_req zone above. A single host is as narrow as this
    # gets and is the correct choice, not a fallback for one.
    #
    # If gacp-network is ever recreated (a plain `docker network rm` +
    # recreate, not just `compose down/up` on the containers — Docker keeps
    # an existing network's subnet across a normal recompose), Docker may
    # assign a different subnet and this gateway address changes. That
    # failure is silent: real-IP restoration simply stops matching and every
    # zone above quietly goes back to being one shared bucket, with nothing
    # in a log or a health check to say so. The runbook's post-recompose
    # check (docs/operations/runbooks/staging-through-docker-nginx.md) tests
    # this with a real request through /__docker-nginx-real-ip-check below —
    # confirm it after every `docker compose down` + `up` that touches
    # gacp-network, not only the first install.
    #
    # real_ip_recursive on: the observed X-Forwarded-For above already
    # carries the same real address twice (Cloudflare's own XFF, then host
    # nginx's `$proxy_add_x_forwarded_for` appending $remote_addr, which by
    # then IS that same restored address) — recursive vs non-recursive makes
    # no difference to today's traffic, since both take the rightmost entry.
    # It is set anyway as the strictly-safer of the two: non-recursive mode
    # trusts whatever the rightmost entry is unconditionally, even if a
    # future hop appended the gateway's own address after the real client's;
    # recursive mode would peel that trusted entry off first and keep walking
    # left until it finds the first address that is NOT 172.18.0.1, which is
    # the correct one. With a single-host trust boundary this only ever helps
    # and never costs anything.
    set_real_ip_from 172.18.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- Diagnostic: what does Docker nginx think the real client is? ----
    # Exists so the gateway-drift risk above is a one-command check, not a
    # log-grepping exercise every time. Mirrors
    # deploy/nginx/gacp-platform.conf's /__access-check — same reasoning: it
    # discloses only information the caller already sent, so it is safe to
    # leave reachable after go-live. Reached at either domain, e.g.
    # https://gacpth.com/__docker-nginx-real-ip-check or the staging
    # equivalent — Cloudflare's edge answers neither of those specially, both
    # pass straight through to here.
    location = /__docker-nginx-real-ip-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nx_forwarded_for=$http_x_forwarded_for\n";

        # nginx does not merge add_header: a block that sets any header of its
        # own inherits NONE from the server. These are repeated so this location
        # is not served without them. Keep in step with the server block above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/pdf;
    gzip_comp_level 6;

    # Buffer settings for large payloads
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 50M;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # X-Robots-Tag "noindex, nofollow" used to sit here, at server scope. GACP
    # certification is a public register — a farm's certificate is meant to be
    # findable — so delisting the whole platform from search was not the intent.
    # It now applies only to the admin surfaces that set it themselves.

    # Phase 2 #2.9 — HSTS + CSP. The host nginx (the public-facing 443
    # listener) already sets HSTS in deploy/nginx/gacp-platform.conf;
    # this Docker-side header is layered for defense-in-depth so internal
    # traffic and any direct hits to the backend container also get it.
    #
    # HSTS: 1 year, includeSubDomains, preload-eligible. Once preloaded
    # at https://hstspreload.org browsers will refuse plain HTTP to this
    # domain even on a fresh install.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    # Content-Security-Policy is deliberately NOT set here, and must not be
    # added back. A browser applies every CSP header it receives and enforces
    # the intersection, so two authorities can only ever produce a policy that
    # is wrong in one direction. This layer can only write a literal; the
    # application knows the values. apps/web-app/src/middleware.ts builds
    #
    #   img-src 'self' data: blob: ${backendOrigin} ${tileOrigin}
    #
    # from the environment. The literal that used to sit here was
    # `img-src 'self' data: blob:`, which intersected both of those away —
    # an operator who configured an in-country tile server per
    # apps/web-app/src/lib/config/map-tiles.ts got a blank map, and documents
    # served straight from the backend origin were refused as images.
    #
    # The layer that knows the values owns the header. That is the app.

    # Remove server version header
    server_tokens off;

    # ---- Nginx stub_status for Prometheus exporter ----
    location = /stub_status {
        stub_status;
        allow 127.0.0.0/8;
        allow 172.16.0.0/12;    # Docker internal networks
        allow 10.0.0.0/8;       # Docker internal networks
        deny all;
        access_log off;
    }

    # ---- Health check (LB probes) ----
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";

        # nginx does not merge add_header: a block that sets any header of its
        # own inherits NONE from the server. These are repeated so this location
        # is not served without them. Keep in step with the server block above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Next.js HMR WebSocket ----
    location /_next/webpack-hmr {
        proxy_pass http://$frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
    }

    # ---- Next.js Static Assets (aggressive caching) ----
    location /_next/static/ {
        proxy_pass http://$frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status "HIT";
        expires 1y;

        # nginx does not merge add_header: a block that sets any header of its
        # own inherits NONE from the server. These are repeated so this location
        # is not served without them. Keep in step with the server block above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Public assets ----
    location /public/ {
        proxy_pass http://$frontend_up;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;

        # nginx does not merge add_header: a block that sets any header of its
        # own inherits NONE from the server. These are repeated so this location
        # is not served without them. Keep in step with the server block above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Backend API: Auth endpoints (stricter rate limiting) ----
    location /api/auth/ {
        limit_req zone=api_auth burst=30;
        limit_conn conn_limit 20;

        proxy_pass http://$backend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Backend API: Application document upload (the ONE true upload path) ----
    # 2026-09-06: the api_upload zone (5r/m) used to sit on ALL of /api/applications/,
    # which also carries the wizard's draft autosave, /config and /requirements — a
    # farmer walking the six steps burned the 10-burst inside two steps and every
    # later step answered 503 ("ไม่สามารถโหลดแบบฟอร์มได้ชั่วคราว"). Found walking
    # staging for real. Uploads keep the strict zone here; everything else under
    # /api/applications/ moves to the general zone below.
    location /api/applications/draft-documents {
        limit_req zone=api_upload burst=10 nodelay;
        client_max_body_size 50M;

        proxy_pass http://$backend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Backend API: Application flow (draft autosave, config, submit …) ----
    location /api/applications/ {
        limit_req zone=api_general burst=100 nodelay;
        client_max_body_size 50M;

        proxy_pass http://$backend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Next.js Session API (handled by frontend, not backend) ----
    location /api/session/ {
        proxy_pass http://$frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ---- Frontend build identity (deploy-drift probe) ----
    # The FRONTEND's "which commit am I" endpoint. Exact-match on purpose: the
    # backend owns /api/version (mobile minClientVersion check) and every other
    # /api/* path, so this carve-out must not shadow anything broader. Without
    # this block the catch-all below sends the path to the backend, the frontend
    # route can never be reached through the proxy, and the deploy-drift probe
    # reads the backend's mobile answer where the frontend's revision should be —
    # which is exactly what happened on its first run, 2026-08-14. The frontend
    # image can be three weeks stale while /api/health is current (observed:
    # frontend 2026-07-23 vs backend 2026-08-05), so the two MUST be checkable
    # separately.
    location = /api/webapp-version {
        proxy_pass http://$frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ---- Backend API: General endpoints ----
    location /api/ {
        limit_req zone=api_general burst=100 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://$backend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        # API specific headers
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'X-Frame-Options' 'DENY' always;

        # nginx does not merge add_header: a block that sets any header of its
        # own inherits NONE from the server. These are repeated so this location
        # is not served without them. Keep in step with the server block above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Uploaded documents / photos — served by the BACKEND ----
    # The backend serves /uploads/* via express.static + middleware/uploads-access
    # (PDPA Section-27 gate on sensitive paths) + uploads-security-headers. Without
    # this proxy, /uploads/* fell through to `location /` (the frontend), which 500s →
    # blank document preview (reported 2026-06-25). Routing through the backend keeps
    # the access gate + the security headers it sets, so they are NOT re-added here.
    location /uploads/ {
        limit_req zone=api_general burst=100 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://$backend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # ---- /pgadmin/ removed 2026-08-23 ----
    # The database is Supabase and the pgadmin container is retired with the
    # postgres it administered. This location had to go WITH it, not after it:
    # `proxy_pass http://pgadmin:80` is a literal upstream name resolved once when
    # nginx loads its config, so leaving it behind would stop this nginx from
    # starting at all the first time the stack came up without pgadmin — taking the
    # whole site down, not just the console. Use the Supabase dashboard instead.

    # ---- Frontend Proxy (Catch-all) ----
    location / {
        proxy_pass http://$frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        # Don't cache HTML pages
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # nginx does not merge add_header: a block that sets any header of its
        # own inherits NONE from the server. These are repeated so this location
        # is not served without them. Keep in step with the server block above.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Branded Error pages ----
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /etc/nginx/error-pages;
        internal;
    }

    # ---- Deny hidden files ----
    location ~ /\. {
        deny all;
        return 404;
    }

    # ---- Deny backup/config files ----
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        return 404;
    }
}
