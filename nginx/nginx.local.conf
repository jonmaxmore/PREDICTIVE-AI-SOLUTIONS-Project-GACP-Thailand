# ============================================================
# GACP Platform - Local Production-like Nginx Configuration
# ============================================================
# Features:
#   - Self-signed SSL (HTTPS)
#   - Mobile API support (Android/iOS origins)
#   - Rate limiting (same as production)
#   - OWASP security headers
#   - WebSocket support for HMR (dev mode)
# ============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Map to allow mobile origins
map $http_origin $cors_origin {
    default "";
    "~^https?://localhost" $http_origin;
    "~^https?://127\\.0\\.0\\.1" $http_origin;
    "~^https?://192\\.168\\.\\d+\\.\\d+" $http_origin;
    "~^https?://10\\.0\\.\\d+\\.\\d+" $http_origin;
    "~^capacitor://localhost" $http_origin;
    "~^ionic://localhost" $http_origin;
    "~^app://localhost" $http_origin;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name localhost;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # SSL Configuration (Self-signed for local)
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/pdf;
    gzip_comp_level 6;

    # Buffer settings
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS Headers for mobile support
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Health check endpoint (port 8080)
    listen 8080;
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Backend API - Auth endpoints (stricter rate limiting)
    location /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_conn conn_limit 5;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Backend API - Upload endpoints
    location /api/upload/ {
        limit_req zone=api_upload burst=10 nodelay;
        client_max_body_size 50M;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API - General endpoints
    location /api/ {
        limit_req zone=api_general burst=100 nodelay;
        limit_conn conn_limit 20;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # API specific headers
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'X-Frame-Options' 'DENY' always;
    }

    # Next.js Static Assets
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # Public assets
    location /public/ {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    # PWA manifest and service worker
    location = /manifest.json {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "no-cache";
    }
    
    location = /sw.js {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "no-cache";
    }

    # Frontend (Catch-all)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Don't cache HTML pages
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
