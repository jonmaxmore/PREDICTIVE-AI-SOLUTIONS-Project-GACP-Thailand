# Dart/Flutter static analysis for the GACP mobile app.
#
# `flutter_lints` has been in dev_dependencies since the app was scaffolded,
# but with no analysis_options.yaml to include it the package was inert:
# `flutter analyze` fell back to the bare default rule set, which reports
# compile errors and nothing else. Every lint the package ships was off.
#
# This file turns the rule set on. The CI job runs the analyzer twice:
# a blocking pass at the current strictness, and a reporting pass at
# `--fatal-infos` that prints the full backlog without failing the build.
# Once that backlog reaches zero the blocking pass takes over the strict
# flags and the reporting pass goes away.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by build_runner (freezed, json_serializable, riverpod
    # generator, widgetbook). Regenerating is the fix for anything the
    # analyzer finds in here, so linting the output is noise.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "**/generated_plugin_registrant.dart"

linter:
  rules:
    # Thai UI copy is written directly in widget trees; requiring const
    # on every literal-only widget is the single largest source of infos
    # in a Flutter tree this size. Kept off until the rest of the backlog
    # is clear so the first strict run reports signal, not one rule.
    prefer_const_constructors: false
