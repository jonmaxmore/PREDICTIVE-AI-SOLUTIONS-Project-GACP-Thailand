# ============================================================
# GACP Platform - Development Docker Compose
# ============================================================
# WARNING: This file is for LOCAL DEVELOPMENT ONLY.
# DO NOT use this file in production. Use docker-compose.production.yml instead.
# ============================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: gacp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-gacp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - create .env file}
      POSTGRES_DB: ${DB_NAME:-gacp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gacp -d gacp_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # Localhost only — never expose DB publicly
    networks:
      - gacp-network

  redis:
    image: redis:7-alpine
    container_name: gacp-redis
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - gacp-network

  backend:
    container_name: gacp-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    environment:
      - PORT=8000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${APP_DB_USER:-${DB_USER:-gacp}}:${APP_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}@postgres:5432/${DB_NAME:-gacp_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - create .env file}
      - CORS_ORIGIN=http://localhost,http://localhost:3000,http://frontend:3000,http://nginx,https://localhost,https://gacpth.com,https://gacpth.com
      - COOKIE_SECURE=false
      # Development only features
      - ENABLE_E2E_ROUTES=true
      - PUBLIC_TRACE_URL=http://localhost/trace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    networks:
      - gacp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    container_name: gacp-frontend
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
        # Build identity (design-reproducibility/01-build-identity): read back by
        # GET /api/webapp-version (build-info.ts). Unset here defaults to "" —
        # same as the Dockerfile's own ARG default — so a plain `docker compose
        # build` with neither var exported honestly reports "unknown build"
        # rather than a stale or wrong commit. Export both before building to
        # stamp it: GIT_SHA=$(git rev-parse HEAD) BUILT_AT=$(date -u +%FT%TZ).
        GIT_SHA: ${GIT_SHA:-}
        BUILT_AT: ${BUILT_AT:-}
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:8000
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - gacp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: gacp-nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gacp-network

networks:
  gacp-network:
    driver: bridge
    name: gacp-network

volumes:
  postgres_data:
    external: true
    name: gacp-postgres-data
  redis_data:
    name: gacp-redis-data-dev
