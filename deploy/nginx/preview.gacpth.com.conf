# ============================================================
# GACP Platform — Host nginx vhost for the hidden PREVIEW environment
# ============================================================
# Install path: /etc/nginx/sites-available/preview.gacpth.com.conf
#
#   ln -s /etc/nginx/sites-available/preview.gacpth.com.conf \
#         /etc/nginx/sites-enabled/preview.gacpth.com.conf
#   nginx -t && systemctl reload nginx
#
# Chain, unchanged from the rest of the platform:
#   Cloudflare (proxied DNS + WAF) → THIS host nginx :443 → containers
#
# ⚠️ ONE DELIBERATE DIFFERENCE from staging.gacpth.com.conf, and everything
# below follows from it: staging forwards to the Docker nginx on 127.0.0.1:8080
# and lets that container pick its upstream from the Host header. Preview does
# NOT. It proxies straight to the preview containers on 127.0.0.1:8002 /
# 127.0.0.1:3002 (docker-compose.preview.yml).
#
# Why: Docker nginx's $host map only knows gacpth.com and staging.gacpth.com.
# Adding preview to it means editing nginx/gacp.production.conf — a file
# PRODUCTION serves from, whose reload trap (bind-mounted per file; `nginx -s
# reload` re-reads the OLD inode, so a `docker restart gacp-nginx` is required)
# interrupts production for 3-5 s. A hidden preview environment is not worth
# touching production's proxy for.
#
# The cost is real and is paid explicitly in this file: everything Docker nginx
# supplies centrally must be supplied HERE instead —
#   - the security-header set        → re-stated below
#   - the /api/session/ → frontend split          → re-stated below
#   - the /api/webapp-version → frontend carve-out → re-stated below
#   - rate limiting (limit_req zones api_general / api_auth / api_upload)
#     → NOT re-stated. Those zones are declared in the Docker nginx http block
#       (nginx/gacp.production.conf:23-25) and do not exist on the host, so
#       naming them here would fail `nginx -t`. Preview runs WITHOUT host
#       rate limiting; the only edge in front of it is Cloudflare's default
#       proxy. Operator ruling 2026-08-22: preview is FULLY PUBLIC — no
#       prelaunch gate, no cookie door, no IP/geo restriction.
#
# DEPENDS ON, at http scope, from /etc/nginx/conf.d (installed by
# deploy/nginx/gacp-platform.conf — nginx refuses to start with "unknown
# variable" if any is missing, which is the right way for that to surface):
#   - set_real_ip_from … / real_ip_header CF-Connecting-IP  (Cloudflare real IP)
#   - map $http_upgrade $connection_upgrade                 (WebSocket upgrade)

# ---- HTTP → redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name preview.gacpth.com;



    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ACME HTTP-01, before the redirect or validation gets a 301 and fails.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # Inline `http2` on the listen line, NOT the standalone `http2 on;`
    # directive — that needs nginx >= 1.25.1 and this origin runs older. The
    # failure mode is nasty: `nginx -t` fails while the running process keeps
    # serving from memory, so nothing looks broken until the next restart, at
    # which point nginx does not come back.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.gacpth.com;




    # Same origin certificate as production and staging (CN=gacpth.com,
    # self-signed, generated by scripts/deploy/setup-host-nginx.sh). Cloudflare
    # terminates TLS for visitors; its SSL mode here is Full, which accepts it.
    # preview.gacpth.com is not in the CN or the SANs — that is fine ONLY
    # because the mode is Full, not Full (strict). If this origin is ever issued
    # a real certificate, point these two lines at it and switch the mode.
    ssl_certificate     /opt/gacp-platform/nginx/ssl/gacp.crt;
    ssl_certificate_key /opt/gacp-platform/nginx/ssl/gacp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_PREVIEW:10m;
    ssl_session_timeout 10m;

    # ---- Security headers ----
    # Staging inherits these from Docker nginx (nginx/gacp.production.conf:161-180).
    # Preview bypasses that container, so the same set is stated here. Keep the
    # two lists in step; a header that exists on staging and not here is a real
    # difference in what is being previewed.
    #
    # No Content-Security-Policy: browsers enforce the INTERSECTION of every CSP
    # they receive, and only the app knows its own backend and map-tile origins.
    # apps/web-app/src/middleware.ts owns it. A literal here would silently
    # subtract from a policy that was computed correctly.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Environment "preview" always;
    server_tokens off;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---- Next.js session API — FRONTEND, not backend ----
    # Docker nginx carves this out (gacp.production.conf:305). Preview has to
    # repeat it: without this block /api/session/* falls into `location /api/`
    # below and reaches the express backend, which has no such route, so every
    # session refresh 404s and the app logs the user out on its own.
    location /api/session/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx does not merge add_header: a block that sets ANY header of its
        # own drops every inherited one. Re-stated, same as the Docker conf does.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # ---- Frontend build identity — FRONTEND, exact match ----
    # scripts/ops/which-build.sh reads exactly this path. The BACKEND owns
    # /api/version (the mobile minClientVersion check) and everything else under
    # /api/, so without this exact-match carve-out the catch-all below answers
    # with the backend's mobile payload where the frontend's revision belongs —
    # which is what happened on the drift probe's first run, 2026-08-14. The two
    # images can drift weeks apart, so they MUST stay separately checkable.
    location = /api/webapp-version {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # ---- Backend API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # ---- Document uploads — served by the backend (express.static behind the
    # PDPA access gate). Without a location here /uploads/* falls through to
    # `location /` and the frontend answers with a 500.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # ---- Everything else — the Next.js frontend ----
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # LOAD-BEARING. The public verify page resolves the origin it embeds in
        # a QR code from x-forwarded-host, allowlisted in
        # apps/web-app/src/lib/verify/public-verify-url.ts. Without this header
        # that code sees no host and falls back to https://gacpth.com, so every
        # QR generated on preview would point at PRODUCTION. The allowlist entry
        # for preview.gacpth.com is supplied through
        # PUBLIC_VERIFY_HOST_ALLOWLIST in docker-compose.preview.yml; both
        # halves are required.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Environment "preview" always;
    }

    # pgAdmin is not a public surface on any host. Preview never proxies to
    # Docker nginx, so this is belt-and-braces rather than the load-bearing
    # block it is in gacp-platform.conf, and it costs nothing.
    location /pgadmin/ {
        deny all;
        return 404;
    }

    # Block sensitive paths, same as staging.
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        return 404;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
