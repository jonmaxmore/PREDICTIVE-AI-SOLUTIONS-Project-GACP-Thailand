# ============================================================
# GACP Platform — Host nginx vhost for staging
# ============================================================
# Drop into /etc/nginx/sites-available/staging.gacpth.com.conf and
# symlink to sites-enabled/. Reload nginx after dropping the file:
#
#   ln -s /etc/nginx/sites-available/staging.gacpth.com.conf \
#         /etc/nginx/sites-enabled/staging.gacpth.com.conf
#   nginx -t && systemctl reload nginx
#
# Routes traffic for staging.gacpth.com to the SAME Docker nginx that
# fronts production — gacp-nginx, published at 127.0.0.1:8080 by
# docker-compose.production.yml (nginx/gacp.production.conf). That
# container picks backend-staging:8000 / frontend-staging:3000 over the
# production containers purely from the incoming Host header (the $host
# maps near the top of nginx/gacp.production.conf), so every location below
# only has to forward the request — Host header included — to :8080 and let
# Docker nginx do the rest (rate limiting, security headers, gzip, the
# /api/session/ → frontend split). See
# docs/operations/runbooks/staging-through-docker-nginx.md.
#
# This vhost no longer talks to 127.0.0.1:8001 / 127.0.0.1:3001 directly —
# those loopback-only ports still exist (docker-compose.staging.yml) but
# bypassing Docker nginx to reach them was the bug this file fixes (it meant
# staging got none of the above, and /api/ never split session traffic to
# the frontend the way production's did).
#
# SSL: same wildcard cert as production (*.gacpth.com via Let's Encrypt).
# If only an apex cert exists, request a new cert covering
# staging.gacpth.com or use Cloudflare's edge cert.

# ---- HTTP → redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name staging.gacpth.com;

    # Pre-launch gate. $gacp_prelaunch_deny, and the Cloudflare real-IP
    # restoration it depends on, are declared at http scope in
    # gacp-platform.conf — which this vhost has always depended on for
    # `X-Real-IP $remote_addr` to mean anything. Install the two together;
    # nginx refuses to start with "unknown variable" if you don't, which is the
    # right way for that mistake to surface.
    if ($gacp_prelaunch_deny) { return 403; }

    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ACME HTTP-01. Must precede the redirect, or Let's Encrypt gets a 301 and
    # validation fails. Same gap as the production vhost had.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # `http2 on;` as a standalone directive needs nginx >= 1.25.1. The origin
    # runs an older build, and installing a vhost that uses it produces
    # `[emerg] unknown directive "http2"` — which fails `nginx -t` while the
    # running process keeps serving from the config already in memory, so
    # nothing looks broken until the next restart, at which point nginx does
    # not come back. The inline form below has worked since 1.9.5 and is what
    # gacp-platform.conf already used.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.gacpth.com;

    if ($gacp_prelaunch_deny) { return 403; }

    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    # Prelaunch-gate cookie door (see the $gacp_gate_cookie_ok map in
    # gacp-platform.conf). Stores whatever t= it is given as the gate cookie
    # and bounces to /; only the CORRECT token passes the deny map afterwards,
    # so a wrong t= sets a worthless cookie and the visitor stays blocked.
    # access_log off so the token never lands in the access log.
    location = /__gate {
        access_log off;
        add_header Set-Cookie "gacp_gate=$arg_t; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    # The same origin certificate gacp-platform.conf uses. This pointed at
    # /etc/letsencrypt/live/gacpth.com/ — which does not exist on this origin,
    # so installing the file gave `[emerg] cannot load certificate` and nginx
    # would not have restarted. Cloudflare terminates TLS for visitors and its
    # SSL mode here is Full, which accepts the origin's self-signed cert; the
    # path is generated by scripts/deploy/setup-host-nginx.sh.
    #
    # If this origin is ever issued a real certificate covering
    # staging.gacpth.com, point these two lines at it and switch Cloudflare to
    # Full (strict).
    ssl_certificate     /opt/gacp-platform/nginx/ssl/gacp.crt;
    ssl_certificate_key /opt/gacp-platform/nginx/ssl/gacp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_STAGING:10m;

    # HSTS used to be suppressed here (staging bypassed Docker nginx and hit
    # the frontend app directly, so nothing added the header centrally). Now
    # that staging routes through the SAME Docker nginx as production
    # (nginx/gacp.production.conf), that container's own
    # `add_header Strict-Transport-Security ...` applies here too and is
    # deliberately NOT hidden below any more — the point of this change is
    # that staging and production get the identical header set (verify with
    # the curl comparison in the runbook). If browsers caching a staging-only
    # cert/HSTS state becomes a real problem again, that is an operator
    # decision to make explicitly, not something to silently re-suppress in
    # this file.

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Environment "staging" always;

    client_max_body_size 50M;

    # Backend API — forwarded to the SAME Docker nginx as production
    # (127.0.0.1:8080), which routes /api/session/ to the frontend and
    # everything else under /api/ to the backend (nginx/gacp.production.conf).
    # Docker nginx picks backend-staging over backend purely from the Host
    # header below.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # DO NOT remove or hardcode this line. Docker nginx's $host map is
        # the ONLY thing that routes staging.gacpth.com to backend-staging
        # instead of production's backend. Losing this header does not
        # error — it silently sends staging traffic into the PRODUCTION
        # backend container. See nginx/gacp.production.conf's map comment.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Document uploads — served by the backend (express.static behind the PDPA
    # gate), reached through the same Docker nginx as production now (was:
    # direct to 127.0.0.1:8001, bypassing Docker nginx entirely — the bug this
    # file fixes). Without a location here, /uploads/* would fall through to
    # `location /` (the frontend) → 500. Docker nginx's own /uploads/ location
    # (nginx/gacp.production.conf, #551) keeps the access gate + security
    # headers the backend sets; do not re-add security headers here, mirroring
    # that file's own note. (2026-06-25, updated 2026-08-08)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # DO NOT remove or hardcode this line — see the /api/ location above.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend — via the same Docker nginx as production.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # DO NOT remove or hardcode this line — see the /api/ location above.
        proxy_set_header Host $host;
        # Fix-round 1 (review 6712f985, S1 hardening): the frontend's public
        # verify page resolves the origin it embeds in a QR code from
        # x-forwarded-host, allowlisted against known hosts (gacpth.com,
        # staging.gacpth.com) in apps/web-app/src/lib/verify/public-verify-url.ts.
        # Without this header set at the edge, that code path would see no
        # host at all and always fall back to the default host.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Block sensitive paths on staging too
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        return 404;
    }
}
