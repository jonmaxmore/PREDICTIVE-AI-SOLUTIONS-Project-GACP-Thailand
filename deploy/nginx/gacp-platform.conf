# ============================================================
# GACP Platform — Host Nginx Reverse Proxy
# ============================================================
# This file runs on the HOST nginx (not inside Docker).
# It listens on ports 80/443 (public) and proxies to the
# Docker-internal Nginx on 127.0.0.1:8080.
#
# Install path: /etc/nginx/sites-available/gacp-platform.conf
# Symlink:      /etc/nginx/sites-enabled/gacp-platform.conf
# ============================================================

# Upstream — Docker Nginx container (bound to localhost only)
upstream docker_nginx_http {
    server 127.0.0.1:8080;
    keepalive 64;
}

# ---- Cloudflare: recover the real visitor IP ----
# The origin sits behind Cloudflare's proxy, so $remote_addr is a Cloudflare
# edge IP. Without this, rate-limiting and audit logs would record Cloudflare
# instead of the real user. Ranges from https://www.cloudflare.com/ips/
# (refresh if Cloudflare updates them).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ============================================================
# Pre-launch access gate
# ============================================================
# The platform is still being built and is not open to the public. Everything
# below implements that, and it deliberately sits *here* rather than in `ufw`.
#
# The firewall was tried first: `ufw` allowing one address on 80/443. That is
# not a private site, it is a broken one. Cloudflare was blocked along with
# everybody else, so the world got 522, and the one allowed machine reached the
# origin directly — bypassing Cloudflare, meeting the origin's self-signed
# certificate, and showing ERR_CERT_AUTHORITY_INVALID to the operator on their
# own government platform.
#
# Here the operator's traffic still goes through Cloudflare, still gets
# Cloudflare's trusted certificate, and outsiders get a clean 403. `ufw` keeps
# its own job — 80/443 open to Cloudflare's ranges *only*, so nobody can reach
# this origin directly and skip the gate. Two layers, two different questions:
# ufw answers "which proxy may connect", this answers "which visitor may enter".
#
# 1 = blocked. An address gets in only by being named. Longest prefix wins, so
# a /32 can carve an exception out of an allowed /64.
geo $remote_addr $gacp_prelaunch_blocked_ip {
    # ⚠ ห้ามพลิกบรรทัดนี้เป็น `default 0;`
    #
    # คอมเมนต์เดิมตรงนี้เขียนว่า "GO-LIVE: เปลี่ยนบรรทัดเดียวเพื่อเปิดแพลตฟอร์มให้สาธารณะ"
    # ซึ่งเขียนไว้ก่อนมติสามโดเมนของ operator (2026-09-05) และพาไปผิดทาง:
    #
    #   geo นี้ถูกอ่านโดย $gacp_demo_deny (demo) **และ** $gacp_prelaunch_deny
    #   (staging + gacpth.com) ⇒ พลิกเป็น 0 = เปิด gacpth.com ให้อินเทอร์เน็ตทั้งใบ
    #   พร้อมกัน ซึ่งขัดมติที่ว่า "gacpth.com ห้ามเปิด public · demo=ลูกค้า staging=เรา"
    #
    # demo เปิดสาธารณะแล้วด้วยการลบแถวเดียวใน map $gacp_demo_deny (ดูด้านล่าง) — ไม่ใช่ที่นี่
    #
    # 1 = บล็อก · ที่อยู่เข้าได้ด้วยการถูกระบุชื่อเท่านั้น
    # อ่าน docs/operations/runbooks/restrict-site-to-one-ip.md ก่อนแตะ
    default 1;

    # -- operator workstation --
    # A /21, not the /32 that used to be here. The operator's ISP rotates their
    # IPv4 daily — .216.224, .218.72 and .221.82 were all observed within one
    # week of 2026-08-14 — so the /32 pin was a lockout on a timer. The IPv6
    # comment below already explains this exact failure mode; the IPv4 line
    # just never applied its own lesson. Widening to the ISP pool admits other
    # customers of that pool to the PRELAUNCH CURTAIN only — every surface
    # behind it still requires login. Operator approved 2026-08-14.
    198.51.100.0/24 0;
    # The supplied IPv6 address is one interface identifier inside this prefix.
    # SLAAC privacy extensions rotate the last 64 bits, typically daily, so
    # pinning the /128 would lock the operator out overnight and the symptom
    # would be indistinguishable from the gate being broken.
    2403:6200:88a4:b3fa::/64 0;
    # 2026-08-18: the ISP rotated the /64 prefix itself (b3fa → 75f observed),
    # which the /64 pin cannot survive — the same lesson the IPv4 line above
    # already applied by widening to the ISP pool (/21). Widen to the /48 that
    # covers the observed rotations; the curtain is the only thing admitted,
    # every surface behind it still requires login. Applied live on the origin
    # the same day (sed + reload, verified __access-check blocked=0).
    2403:6200:88a4::/48 0;

    # -- on-host --
    # Health checks, deploy smoke tests, and `curl` run from the server itself.
    127.0.0.1/32 0;
    ::1/128 0;
    # The server's own PUBLIC egress address. An on-host curl to the public
    # domain does not arrive as 127.0.0.1: it traverses Cloudflare and comes
    # back with real_ip rewritten to this address (real_ip_header
    # CF-Connecting-IP above). Without this line the deploy-drift probe, the
    # deploy script's smoke check, and every diagnostic curl in the runbooks
    # are blocked by the gate they sit behind — observed 2026-08-14, when
    # installing this file returned 403 to the very probe run that was meant
    # to verify the deployment it had just proven.
    203.0.113.10/32 0;

    # -- add office / QA addresses here, one per line, value 0 --
}

# Paths that must answer even to a blocked address.
map $request_uri $gacp_prelaunch_exempt {
    default 0;

    # Being blocked has to be diagnosable. Without this, "my ISP moved me to a
    # new address" and "the gate is misconfigured" produce exactly the same
    # symptom, and the only way to tell them apart is to open the site to
    # everyone and see whether that fixes it.
    ~^/__access-check 1;

    # Let's Encrypt validates over plain HTTP from its own servers. Blocking it
    # does not fail the deploy; it fails the renewal, 60 days later, silently.
    ~^/\.well-known/acme-challenge/ 1;

    # The cookie door (staging vhost, `location = /__gate`) must be reachable
    # from a blocked address — that is its entire point. It only SETS a cookie;
    # whether that cookie passes the gate is decided by $gacp_gate_cookie_ok
    # below, so exempting the URI grants nothing by itself.
    ~^/__gate 1;

    # Stripe webhook (operator-approved 2026-09-27): Stripe calls from its own addresses and
    # cannot hold the gate cookie. The route verifies Stripe's signature itself (400 without it).
    # Exact path only.
    ~^/api(/v1)?/webhooks/stripe$ 1;
}

# Cookie exemption — the fix for lockouts #1-#4 (a /32 pin, a /128 pin, a /64
# prefix rotation, and finally a mobile-carrier address the prefix game can
# never cover: 2026-08-20, the operator's phone on 2001:44c8::/32). An IP
# allowlist cannot follow a device across networks; a cookie can. Open
# https://staging.gacpth.com/__gate?t=<token> ONCE on the device and it is
# admitted from any network until the cookie expires (1 year) or the token
# is rotated.
#
# The token itself lives OUTSIDE git in /etc/nginx/gacp-gate-token.conf
# (exactly one line:  "<hex>" 1;  — root:root 600). The include below is a
# MASK, so a missing token file is fail-soft: no cookie ever matches and the
# gate behaves exactly as it did before this block existed. Rotate by
# rewriting that file + reload. Documented in docs/operations/domain-access.md.
map $cookie_gacp_gate $gacp_gate_cookie_ok {
    default 0;
    include /etc/nginx/gacp-gate-token[.]conf;
}

map "$gacp_prelaunch_blocked_ip:$gacp_prelaunch_exempt:$gacp_gate_cookie_ok" $gacp_prelaunch_deny {
    default 0;
    "1:0:0" 1;
}

# ---- the bare domain: address only, no token opens it --------------------
#
# A cookie cannot be scoped to one vhost here. `gacp_gate` is set on
# staging.gacpth.com with Path=/ and no Domain attribute, but every host under
# gacpth.com was checked by the one map above, so a visitor admitted to STAGING
# was admitted to gacpth.com by the same cookie. Handing a customer the gate
# link to see the demo therefore also handed them the bare domain, for the year
# the cookie lives.
#
# That is the one thing the bare domain must never do. Until this platform is an
# official ministry system, a stranger finding a working GACP certification site
# at gacpth.com is a legal problem, not a support ticket — so gacpth.com answers
# to ADDRESS ONLY and no token can open it.
#
# Consequence, accepted deliberately: when the operator's ISP rotates them out
# of the allowlisted prefixes, gacpth.com goes 403 for them too and the cookie
# will NOT rescue it (that is the point). staging.gacpth.com still admits by
# cookie from any network (demo needs no cookie at all — see $gacp_demo_deny), and
# /__access-check still answers here, so the lockouts #1-#4 diagnosis path is unchanged.
map "$gacp_prelaunch_blocked_ip:$gacp_prelaunch_exempt" $gacp_bare_domain_deny {
    default 0;
    "1:0" 1;
}

# ---- demo.gacpth.com: the customer's own token ---------------------------
#
# A SEPARATE cookie name and a SEPARATE token file, so the two audiences can be
# revoked independently: rotate the demo token when a customer engagement ends
# and we keep staging; our own token opens both and is never handed out.
#
# Same fail-soft include as above — a missing token file means no cookie ever
# matches, so the gate closes rather than opens.
map $cookie_gacp_demo_gate $gacp_demo_token_ok {
    default 0;
    include /etc/nginx/gacp-demo-token[.]conf;
}

map "$gacp_gate_cookie_ok$gacp_demo_token_ok" $gacp_demo_cookie_ok {
    default 0;
    "10" 1;   # our token
    "01" 1;   # the customer's token
    "11" 1;
}

# demo.gacpth.com IS production and is open to the public (operator 2026-09-17:
# "demo = production server", answer 1 of the audit decision list). The row that
# used to deny an unlisted address without a cookie — `"1:0:0" 1;` — was removed on
# the host by hand before that ruling was written down; this file now records it, and
# scripts/probes/nginx-config-drift.sh fails whenever the host and this file disagree.
# Consequence: nothing at the edge filters who reaches the demo backend, so the
# application itself must withstand anonymous traffic (audit BACK-01, SECU-02).
map "$gacp_prelaunch_blocked_ip:$gacp_prelaunch_exempt:$gacp_demo_cookie_ok" $gacp_demo_deny {
    default 0;
}

# ---- HTTP → Redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name gacpth.com localhost _;

    if ($gacp_bare_domain_deny) { return 403; }

    # What address does nginx think you are? Answered before the gate, and
    # scoped to the caller's own connection, so it discloses nothing the caller
    # did not already send.
    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    # Allow health checks over plain HTTP
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ---- ACME HTTP-01 challenge ----
    # Must be answered over plain HTTP and must come before the redirect below,
    # or Let's Encrypt receives a 301 and validation fails. `^~` also makes
    # nginx stop at this prefix rather than falling through to `location /`.
    #
    # This lived only in the deployed copy, injected at run time by
    # scripts/maintenance/fix-certbot-renewal.sh — so every deploy of this
    # tracked file silently wiped it and renewal broke with no visible failure
    # until the certificate expired and the site went untrusted. Tracked here so
    # that cannot happen again.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS — Main entry point ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gacpth.com localhost _;

    if ($gacp_bare_domain_deny) { return 403; }

    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    # SSL certificates mounted on the host edge.
    ssl_certificate     /opt/gacp-platform/nginx/ssl/gacp.crt;
    ssl_certificate_key /opt/gacp-platform/nginx/ssl/gacp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (outer layer)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
    # No Content-Security-Policy here — see nginx/gacp.production.conf for the
    # reasoning. In short: browsers enforce the intersection of every CSP they
    # receive, and only the application can know the backend and map-tile
    # origins, so a literal at this layer silently subtracts from a policy that
    # was computed correctly. apps/web-app/src/middleware.ts owns it.
    server_tokens off;

    # Body size — must be >= Docker Nginx so large uploads pass through
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---- pgAdmin is not a public surface ----
    # The Docker nginx has a `location /pgadmin/` guarded by
    # `allow 127.0.0.0/8; allow 172.16.0.0/12; allow 10.0.0.0/8; deny all;`,
    # which reads like an IP whitelist and is not one: inside the container
    # $remote_addr is always the Docker bridge, which 172.16.0.0/12 covers, so
    # `deny all` can never fire. This file is the only layer that sees the real
    # visitor, and it had no /pgadmin/ location at all — so the request fell
    # through the catch-all below and reached the database console, protected by
    # nothing but pgAdmin's own login form.
    #
    # Refused outright here. Operators reached it over an SSH tunnel:
    #   ssh -L 8888:localhost:8080 <host>   then http://localhost:8888/pgadmin/
    #
    # 2026-08-23: that tunnel no longer leads anywhere — the database is Supabase,
    # and pgadmin was retired with the postgres it administered, so the Docker
    # nginx has no /pgadmin/ location any more. This block stays anyway: it costs
    # nothing, and it keeps the path answering 404 rather than falling through the
    # catch-all below if anything ever re-introduces that upstream. Database
    # administration is the Supabase dashboard now.
    location /pgadmin/ {
        deny all;
        return 404;
    }

    # Proxy to Docker Nginx over loopback HTTP.
    location / {
        proxy_pass http://docker_nginx_http;
        proxy_http_version 1.1;

        # Pass real client info
        proxy_set_header Host              $host;
        # Fix-round 1 (review 6712f985, S1 hardening): the frontend's public
        # verify page resolves the origin it embeds in a QR code from
        # x-forwarded-host, allowlisted against known hosts (gacpth.com,
        # staging.gacpth.com) in apps/web-app/src/lib/verify/public-verify-url.ts.
        # Without this header set at the edge, that code path would see no
        # host at all and always fall back to the default host.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Next.js HMR if needed)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass          $http_upgrade;

        # Buffer settings for large responses
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Required for WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
