# ============================================================
# GACP Platform — Host nginx vhost for demo.gacpth.com
# ============================================================
# THE BUILD A CUSTOMER IS SHOWN. Modelled on staging.gacpth.com.conf, which is
# where every comment below was learned; the differences from it are the point:
#
#   1. Its own cookie, `gacp_demo_gate`, checked by its own map. The customer's
#      token opens THIS host and nothing else, so it can be rotated when a demo
#      ends without evicting us from staging — and our own token, which opens
#      both, is never handed out.
#   2. It answers on $gacp_demo_deny, not $gacp_prelaunch_deny.
#   3. Backed by backend-demo/frontend-demo (docker-compose.demo.yml) on the
#      Supabase project that holds the demo material, NOT by the staging pair.
#
# The bare gacpth.com is dark on purpose and no cookie opens it — until this
# platform is an official ministry system, a stranger finding a working GACP
# certification site there is a legal problem. See the $gacp_bare_domain_deny
# map in gacp-platform.conf.
#
# Install:
#   ln -s /etc/nginx/sites-available/demo.gacpth.com.conf \
#         /etc/nginx/sites-enabled/demo.gacpth.com.conf
#   nginx -t && systemctl reload nginx
#
# Routes demo.gacpth.com to the SAME Docker nginx that fronts production —
# gacp-nginx at 127.0.0.1:8080 — which picks backend-demo:8000 /
# frontend-demo:3000 purely from the incoming Host header ($host maps at the top
# of nginx/gacp.production.conf). Every location below therefore only forwards
# the request, Host header included, to :8080 and lets that container do rate
# limiting, security headers, gzip and the /api/session/ split.
#
# Reaching 127.0.0.1:8003 / :3003 directly would bypass all of that. Do not.
#
# SSL: Cloudflare terminates TLS for visitors; the origin cert below is
# self-signed and Cloudflare's SSL mode is Full, which accepts it.

# ---- HTTP → redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name demo.gacpth.com;

    # Pre-launch gate. $gacp_demo_deny, and the Cloudflare real-IP
    # restoration it depends on, are declared at http scope in
    # gacp-platform.conf — which this vhost has always depended on for
    # `X-Real-IP $remote_addr` to mean anything. Install the two together;
    # nginx refuses to start with "unknown variable" if you don't, which is the
    # right way for that mistake to surface.
    if ($gacp_demo_deny) { return 403; }

    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ACME HTTP-01. Must precede the redirect, or Let's Encrypt gets a 301 and
    # validation fails. Same gap as the production vhost had.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # `http2 on;` as a standalone directive needs nginx >= 1.25.1. The origin
    # runs an older build, and installing a vhost that uses it produces
    # `[emerg] unknown directive "http2"` — which fails `nginx -t` while the
    # running process keeps serving from the config already in memory, so
    # nothing looks broken until the next restart, at which point nginx does
    # not come back. The inline form below has worked since 1.9.5 and is what
    # gacp-platform.conf already used.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.gacpth.com;

    if ($gacp_demo_deny) { return 403; }

    location = /__access-check {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "remote_addr=$remote_addr\nvia=$realip_remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nblocked=$gacp_prelaunch_blocked_ip\n";
    }

    # Prelaunch-gate cookie door (see the $gacp_gate_cookie_ok map in
    # gacp-platform.conf). Stores whatever t= it is given as the gate cookie
    # and bounces to /; only the CORRECT token passes the deny map afterwards,
    # so a wrong t= sets a worthless cookie and the visitor stays blocked.
    # access_log off so the token never lands in the access log.
    location = /__gate {
        access_log off;
        add_header Set-Cookie "gacp_demo_gate=$arg_t; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    # The same origin certificate gacp-platform.conf uses. This pointed at
    # /etc/letsencrypt/live/gacpth.com/ — which does not exist on this origin,
    # so installing the file gave `[emerg] cannot load certificate` and nginx
    # would not have restarted. Cloudflare terminates TLS for visitors and its
    # SSL mode here is Full, which accepts the origin's self-signed cert; the
    # path is generated by scripts/deploy/setup-host-nginx.sh.
    #
    # If this origin is ever issued a real certificate covering
    # demo.gacpth.com, point these two lines at it and switch Cloudflare to
    # Full (strict).
    ssl_certificate     /opt/gacp-platform/nginx/ssl/gacp.crt;
    ssl_certificate_key /opt/gacp-platform/nginx/ssl/gacp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_DEMO:10m;

    # HSTS is not suppressed here (the lesson staging learned when it bypassed
    # the frontend app directly, so nothing added the header centrally). Now
    # Docker nginx and hit the frontend directly). This host routes through
    # (nginx/gacp.production.conf), that container's own
    # `add_header Strict-Transport-Security ...` applies here too and is
    # deliberately NOT hidden below any more — the point of this change is
    # the same Docker nginx, so it inherits that container's own
    # Strict-Transport-Security header. If browsers caching a demo-only
    # cert/HSTS state becomes a real problem again, that is an operator
    # decision to make explicitly, not something to silently re-suppress in
    # this file.

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Environment "demo" always;

    client_max_body_size 50M;

    # Backend API — forwarded to the SAME Docker nginx as production
    # (127.0.0.1:8080), which routes /api/session/ to the frontend and
    # everything else under /api/ to the backend (nginx/gacp.production.conf).
    # Docker nginx picks backend-demo over backend purely from the Host
    # header below.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # DO NOT remove or hardcode this line. Docker nginx's $host map is
        # the ONLY thing that routes demo.gacpth.com to backend-demo
        # instead of production's backend. Losing this header does not
        # error — it silently sends demo traffic into the PRODUCTION
        # backend container. See nginx/gacp.production.conf's map comment.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Document uploads — served by the backend (express.static behind the PDPA
    # gate), reached through the same Docker nginx as production now (was:
    # direct to 127.0.0.1:8002, bypassing Docker nginx entirely — the bug this
    # file fixes). Without a location here, /uploads/* would fall through to
    # `location /` (the frontend) → 500. Docker nginx's own /uploads/ location
    # (nginx/gacp.production.conf, #551) keeps the access gate + security
    # headers the backend sets; do not re-add security headers here, mirroring
    # that file's own note. (2026-06-25, updated 2026-08-08)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # DO NOT remove or hardcode this line — see the /api/ location above.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend — via the same Docker nginx as production.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # DO NOT remove or hardcode this line — see the /api/ location above.
        proxy_set_header Host $host;
        # Fix-round 1 (review 6712f985, S1 hardening): the frontend's public
        # verify page resolves the origin it embeds in a QR code from
        # x-forwarded-host, allowlisted against known hosts (gacpth.com,
        # demo.gacpth.com) in apps/web-app/src/lib/verify/public-verify-url.ts.
        # Without this header set at the edge, that code path would see no
        # host at all and always fall back to the default host.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Block sensitive paths here too
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        return 404;
    }
}
