# GACP Platform — logrotate configuration
#
# Install path: /etc/logrotate.d/gacp-platform  (mode 0644)
# Installer:    scripts/maintenance/install-logrotate.sh
#
# logrotate is invoked daily by /etc/cron.daily/logrotate on most distros;
# this file is consulted on each invocation. Rotation is no-op if the
# rotation period hasn't elapsed.

# ── Container nginx access/error logs ──
# docker-compose.production.yml mounts ./logs/nginx into the gacp-nginx
# container's /var/log/nginx. We rotate from the host side using
# `copytruncate` so we don't have to coordinate with the container's
# file descriptors — nginx keeps writing to the same inode while we
# copy + truncate it underneath.
/opt/gacp-platform/logs/nginx/*.log {
    # `su root root` tells logrotate which user/group to use; without it,
    # logrotate refuses to rotate when the parent dir is group/world-writable
    # (Ubuntu's /var/log is g+w to syslog/adm). Required for both blocks.
    su root root
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    sharedscripts
    postrotate
        # Best-effort reload — if the container is down or the binary
        # path moves, don't fail the rotation.
        docker exec gacp-nginx nginx -s reload 2>/dev/null || true
    endscript
}

# ── Platform operational logs ──
# These are written by host-side scripts (deploy, backup cron, secret
# rotator). Weekly rotation with 12-week retention is enough for
# operational debugging without bloating /var/log.
/var/log/gacp-deploys/*.log /var/log/gacp-backup.log /var/log/gacp-secret-rotations.log {
    # See note in nginx block above — Ubuntu's /var/log is g+w, so logrotate
    # demands an explicit `su` directive before it will operate on these.
    su root root
    weekly
    rotate 12
    compress
    missingok
    notifempty
    copytruncate
}

