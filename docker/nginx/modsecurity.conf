# ModSecurity Web Application Firewall Configuration
# Production-ready WAF rules for GACP Platform

# Enable ModSecurity
SecRuleEngine On

# Default action
SecDefaultAction "phase:1,deny,log,status:403"
SecDefaultAction "phase:2,deny,log,status:403"

# Audit logging
SecAuditEngine RelevantOnly
SecAuditLog /var/log/nginx/modsec_audit.log
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial

# Debug logging (disable in production)
SecDebugLog /var/log/nginx/modsec_debug.log
SecDebugLogLevel 0

# Request body handling
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 512

# Response body handling
SecResponseBodyAccess On
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# File uploads
SecUploadDir /tmp
SecUploadKeepFiles Off

# Collection timeouts
SecCollectionTimeout 600

# ==================== OWASP CORE RULE SET ====================

# SQL Injection Protection
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|ARGS_NAMES|ARGS|XML:/* \
    "@rx (?i:(?:select\s*\*\s*from|(?:delete|drop|truncate)\s+table|union(?:\s+all)?\s+select|insert\s+into|(?:union|create|rename|truncate|load)\s+table|alter\s+table|delete\s+from|(?:union|select|create|rename|truncate|load|alter|delete|update|insert|drop)\s*\(\s*\)|\bdrop\b|\bunion\b|\bselect\b|\bdelete\b|\binsert\b|\bupdate\b))" \
    "id:942100,phase:2,deny,status:403,msg:'SQL Injection Attack Detected',logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',tag:'paranoia-level/1',tag:'OWASP_CRS',tag:'capec/1000/152/248/66',ver:'OWASP_CRS/3.3.4',severity:'CRITICAL',setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}'"

# XSS Protection
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|ARGS_NAMES|ARGS|XML:/* \
    "@rx (?i)(<script[^>]*>[\\s\\S]*?</script>|<script[^>]*src=[^>]*>|<script[^>]*>|<javascript:[^>]*>|<iframe[^>]*>|<object[^>]*>|<embed[^>]*>|<applet[^>]*>|<form[^>]*>|<input[^>]*type=[\"']*image[\"']*[^>]*>|<body[^>]*onload=[^>]*>|<[^>]*on\w+\s*=)" \
    "id:941100,phase:2,deny,status:403,msg:'XSS Attack Detected',logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-xss',tag:'paranoia-level/1',tag:'OWASP_CRS',tag:'capec/1000/152/242',ver:'OWASP_CRS/3.3.4',severity:'CRITICAL',setvar:'tx.xss_score=+%{tx.critical_anomaly_score}'"

# Local File Inclusion (LFI)
SecRule REQUEST_FILENAME|ARGS_NAMES|ARGS|XML:/* \
    "@rx (?i)(?:\x5c|(?:%(?:c(?:0%(?:[2aq]f|5c|9v)|1%(?:[19p]c|8s|af))|2(?:5(?:c(?:0%25af|1%259c)|2f|5c)|%46|f)|(?:(?:f(?:8%8)?0%8|e)0%80%8|f%c0%80%a)0%80%af|%3(?:2(?:%(?:%256|4)|6)|5%%63)|u(?:221[56]|002f|ef(?:c8|80))|5c(?:0(?:0(?:0[01])?|(?:[06]1)?c)|1(?:1(?:0[01])?|5f)?)|%(?:2(?:45|c5|65)|5(?:45|c5|f5)))|0x(?:2f|5c)|\x5c|/))(?:%(?:c(?:0%(?:[2aq]f|5c|9v)|1%(?:[19p]c|8s|af))|2(?:5(?:c(?:0%25af|1%259c)|2f|5c)|%46|f)|(?:(?:f(?:8%8)?0%8|e)0%80%8|f%c0%80%a)0%80%af|%3(?:2(?:%(?:%256|4)|6)|5%%63)|u(?:221[56]|002f|ef(?:c8|80))|5c(?:0(?:0(?:0[01])?|(?:[06]1)?c)|1(?:1(?:0[01])?|5f)?)|%(?:2(?:45|c5|65)|5(?:45|c5|f5))))|(?:\x5c|%(?:2(?:5(?:c(?:0%25af|1%259c)|2f|5c)|%46|f)|(?:(?:f(?:8%8)?0%8|e)0%80%8|f%c0%80%a)0%80%af))" \
    "id:930100,phase:2,deny,status:403,msg:'Path Traversal Attack',logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-lfi',tag:'paranoia-level/1',tag:'OWASP_CRS',tag:'capec/1000/255/153/126',ver:'OWASP_CRS/3.3.4',severity:'CRITICAL',setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Remote File Inclusion (RFI)
SecRule REQUEST_FILENAME|ARGS_NAMES|ARGS|XML:/* \
    "@rx (?i)(?:^(?:http|ftp|https|ftps|sftp)://)" \
    "id:931100,phase:2,deny,status:403,msg:'RFI Attack Detected',logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-rfi',tag:'paranoia-level/1',tag:'OWASP_CRS',tag:'capec/1000/152/175/253',ver:'OWASP_CRS/3.3.4',severity:'CRITICAL',setvar:'tx.rfi_score=+%{tx.critical_anomaly_score}'"

# Command Injection
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|ARGS_NAMES|ARGS|XML:/* \
    "@rx (?i)(?:;|\{|\||\|\||&|&&|\n|\r|\$\(|\$\{|`|<\(|<\(|\(\s*\))\s*[\w,\-_]+\s*\(|[\w\-_]+\s*=\s*\$" \
    "id:932100,phase:2,deny,status:403,msg:'Remote Command Execution: Unix Command Injection',logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',tag:'application-multi',tag:'language-shell',tag:'platform-unix',tag:'attack-rce',tag:'paranoia-level/1',tag:'OWASP_CRS',tag:'capec/1000/152/248/88',ver:'OWASP_CRS/3.3.4',severity:'CRITICAL',setvar:'tx.rce_score=+%{tx.critical_anomaly_score}'"

# ==================== CUSTOM GACP RULES ====================

# Block access to sensitive files
SecRule REQUEST_FILENAME "@rx \.(git|svn|env|htaccess|htpasswd|ini|log|sql|bak|backup|swp|old)$" \
    "id:1000001,phase:1,deny,status:403,msg:'Access to sensitive file detected',logdata:'%{MATCHED_VAR}'"

# Block access to hidden files
SecRule REQUEST_FILENAME "@beginsWith /\." \
    "id:1000002,phase:1,deny,status:403,msg:'Access to hidden file/directory detected'"

# Limit request size for specific endpoints
SecRule REQUEST_URI "@contains /api/upload" \
    "id:1000003,phase:1,deny,status:413,chain,msg:'Upload size limit exceeded'"
    SecRule REQUEST_BODY_LENGTH "@gt 52428800" \
        "t:none"

# Rate limiting per IP (additional to Nginx)
SecAction "id:1000004,phase:1,initcol:ip=%{REMOTE_ADDR},nolog"

SecRule IP:REQUEST_COUNT "@gt 1000" \
    "id:1000005,phase:1,deny,status:429,msg:'Rate limit exceeded',setenv:RATELIMITED"

SecAction "id:1000006,phase:1,setvar:ip.request_count=+1,expirevar:ip.request_count=60,nolog"

# Block known bad user agents
SecRule REQUEST_HEADERS:User-Agent "@rx (curl|wget|python|nikto|sqlmap|nmap|masscan|zgrab|go-http|java|scrapy|bot|spider|crawler)" \
    "id:1000007,phase:1,deny,status:403,msg:'Bad user agent detected',logdata:'%{MATCHED_VAR}'"

# Protect against credential stuffing
SecRule REQUEST_URI "@contains /api/auth" \
    "id:1000008,phase:1,initcol:user=%{ARGS.username},nolog,chain"
    SecRule USER:LOGIN_ATTEMPTS "@gt 5" \
        "deny,status:429,msg:'Too many login attempts, please try again later',expirevar:user.login_attempts=900"

SecAction "id:1000009,phase:1,setvar:user.login_attempts=+1,nolog"

# Block requests without proper headers (bots/scanners)
SecRule REQUEST_HEADERS:Accept "@eq 0" \
    "id:1000010,phase:1,deny,status:403,msg:'Missing Accept header'"

SecRule REQUEST_HEADERS:Host "@eq 0" \
    "id:1000011,phase:1,deny,status:403,msg:'Missing Host header'"

# ==================== EXCEPTIONS ====================

# Allow specific paths for health checks
SecRule REQUEST_URI "@beginsWith /health" \
    "id:1000100,phase:1,allow,nolog"

# Allow specific paths for Prometheus metrics
SecRule REQUEST_URI "@beginsWith /api/metrics" \
    "id:1000101,phase:1,allow,nolog,ctl:ruleEngine=Off"
